<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Démo — Ressource Utility (illustration)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Recréation HTML/CSS de l'interface réelle de Ressource Utility (illustration). */
:root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; }
.desk { position: relative; overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }

/* Fonds abstraits (dégradés, aucune image tierce) */
.theme-dark .desk, .desk.theme-dark {
  background:
    radial-gradient(60% 70% at 18% 20%, rgba(70, 130, 255, .55), transparent 62%),
    radial-gradient(55% 60% at 85% 15%, rgba(168, 85, 247, .45), transparent 60%),
    radial-gradient(70% 70% at 70% 95%, rgba(20, 184, 166, .40), transparent 62%),
    linear-gradient(160deg, #0c1030, #171236 55%, #0a1a2e);
}
.desk.theme-light {
  background:
    radial-gradient(60% 70% at 15% 15%, rgba(255, 190, 150, .85), transparent 62%),
    radial-gradient(55% 60% at 85% 12%, rgba(150, 190, 255, .85), transparent 60%),
    radial-gradient(70% 70% at 65% 100%, rgba(170, 230, 210, .85), transparent 62%),
    linear-gradient(160deg, #e9edff, #f6ecf5 55%, #e3f1f4);
}

/* Barre des menus (macOS 26 : translucide) */
.menubar { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center;
  justify-content: flex-end; gap: 16px; padding: 0 12px; font-size: 13px; font-weight: 500;
  background: rgba(255, 255, 255, .06); backdrop-filter: blur(24px); }
.theme-dark .menubar { color: #fff; }
.theme-light .menubar { color: #14161f; background: rgba(255,255,255,.35); }
.menubar svg { display: block; }
.tray { display: flex; align-items: center; gap: 6px; padding: 2px 8px; margin: 0 -2px; border-radius: 7px; height: 24px; }
.tray.open { background: rgba(255, 255, 255, .28); }
.theme-light .tray.open { background: rgba(0, 0, 0, .14); }
.tray .ttl { font-variant-numeric: tabular-nums; letter-spacing: .1px; white-space: nowrap; }

/* Menu déroulant */
.menu { position: absolute; width: 330px; padding: 6px; border-radius: 15px; font-size: 13px; line-height: 1;
  backdrop-filter: blur(44px) saturate(1.8); }
.theme-dark .menu { background: rgba(44, 44, 50, .70); color: #f5f5f7;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.22) inset, 0 0 0 .5px rgba(0,0,0,.6), 0 16px 48px rgba(0,0,0,.5); }
.theme-light .menu { background: rgba(250, 250, 252, .74); color: #1d1d1f;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.8) inset, 0 0 0 .5px rgba(0,0,0,.18), 0 16px 48px rgba(30,30,60,.28); }
.mi { height: 26px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mi.dis { opacity: .5; }
.mi.dis .chart { opacity: 1; }
.mi .chart { width: 120px; height: 18px; flex: none; }
.mi .kbd { margin-left: auto; opacity: .55; letter-spacing: 2px; font-size: 13px; }
.mi .arrow { margin-left: auto; opacity: .75; display: flex; }
.mi.hover { background: #0a6cff; color: #fff; }
.mi.hover .kbd, .mi.hover .arrow { opacity: .9; }
.sep { height: 1px; margin: 5px 10px; background: rgba(128, 128, 128, .28); }
.sub { width: 392px; }
.mi.dis.live { opacity: .5; }

/* Boîtes de dialogue (style osascript) */
.dlg { position: absolute; border-radius: 22px; padding: 22px 22px 18px; font-size: 13px; line-height: 1.4;
  backdrop-filter: blur(44px) saturate(1.6); }
.theme-dark .dlg { background: rgba(40, 40, 46, .84); color: #f5f5f7;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.25) inset, 0 0 0 .5px #000, 0 24px 70px rgba(0,0,0,.6); }
.theme-light .dlg { background: rgba(246, 246, 249, .88); color: #1d1d1f;
  box-shadow: 0 0 0 .5px rgba(255,255,255,.9) inset, 0 0 0 .5px rgba(0,0,0,.2), 0 24px 70px rgba(30,30,60,.35); }
.dlg .row { display: flex; gap: 18px; }
.dlg .appicon { width: 64px; height: 64px; flex: none; border-radius: 14px; }
.dlg .body { min-width: 0; flex: 1; }
.dlg h4 { margin: 2px 0 8px; font-size: 13px; font-weight: 700; }
.dlg .txt { white-space: pre-wrap; font-size: 13px; }
.dlg .txt.small { font-size: 12px; line-height: 1.42; }
.btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.btn { height: 28px; padding: 0 16px; border-radius: 14px; display: flex; align-items: center; font-size: 13px; font-weight: 500; white-space: nowrap; }
.theme-dark .btn { background: rgba(255,255,255,.16); color: #fff; }
.theme-light .btn { background: rgba(0,0,0,.08); color: #1d1d1f; }
.btn.def { background: #0a6cff !important; color: #fff !important; }
.btn.press { filter: brightness(.8); }

/* Notification */
.notif { position: absolute; width: 360px; border-radius: 20px; padding: 12px 14px; display: flex; gap: 10px;
  font-size: 13px; line-height: 1.35; backdrop-filter: blur(40px) saturate(1.8); }
.theme-dark .notif { background: rgba(50, 50, 58, .78); color: #f5f5f7; box-shadow: 0 0 0 .5px rgba(255,255,255,.2) inset, 0 12px 36px rgba(0,0,0,.45); }
.theme-light .notif { background: rgba(252,252,254,.82); color: #1d1d1f; box-shadow: 0 0 0 .5px rgba(0,0,0,.15), 0 12px 36px rgba(30,30,60,.3); }
.notif img { width: 38px; height: 38px; border-radius: 9px; flex: none; }
.notif b { display: block; font-size: 13px; margin-bottom: 1px; }
.notif .when { margin-left: auto; opacity: .5; font-size: 11px; }

/* Fenêtre Réglages */
.win { position: absolute; width: 440px; border-radius: 16px; overflow: hidden; font-size: 13px; }
.theme-dark .win { background: #2b2b30; color: #f2f2f5; box-shadow: 0 0 0 .5px rgba(255,255,255,.2), 0 24px 70px rgba(0,0,0,.6); }
.theme-light .win { background: #ececec; color: #1d1d1f; box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 24px 70px rgba(30,30,60,.35); }
.win .tb { height: 38px; display: flex; align-items: center; justify-content: center; position: relative; font-weight: 600; font-size: 13px; }
.win .lights { position: absolute; left: 14px; display: flex; gap: 8px; }
.win .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.win .cnt { position: relative; height: 420px; }
.win .abs { position: absolute; }
.win .h { font-weight: 700; }
.win .lbl { white-space: nowrap; }
.field { height: 26px; border-radius: 6px; padding: 0 9px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
.theme-dark .field { background: #1c1c20; box-shadow: 0 0 0 .5px rgba(255,255,255,.18) inset; }
.theme-light .field { background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.18); }
.field.pop { border-radius: 7px; justify-content: space-between; }
.theme-dark .field.pop { background: #4a4a50; }
.theme-light .field.pop { background: #dcdcdc; }
.ph { opacity: .45; }
.chev { display: flex; opacity: .8; }
.pbtn { height: 26px; padding: 0 12px; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
.theme-dark .pbtn { background: #4a4a50; }
.theme-light .pbtn { background: #dcdcdc; }
.pbtn.def { background: #0a6cff !important; color: #fff; }
.hintt { font-size: 11px; opacity: .6; }
.link { color: #0a84ff; }
.check { width: 15px; height: 15px; border-radius: 4px; background: #0a6cff; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; font-weight: 800; }

/* Curseur */
.cursor { position: absolute; width: 22px; height: 28px; z-index: 50; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.caption { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; z-index: 40; }
.caption span { display: inline-block; padding: 9px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; }
.theme-dark .caption span { background: rgba(10,10,20,.62); color: #fff; backdrop-filter: blur(20px); }
.theme-light .caption span { background: rgba(255,255,255,.7); color: #14161f; backdrop-filter: blur(20px); }
.tag { position: absolute; right: 12px; bottom: 8px; font-size: 11px; opacity: .55; color: #fff; z-index: 40; }
.theme-light .tag { color: #14161f; }

html,body{margin:0;height:100%;background:#0b0d22;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}

<script>/* Recréation HTML de l'interface réelle (textes, ordre et emoji repris du code Rust).
   Illustration : les chiffres sont fictifs. */
(function () {
  const RU = (window.RU = {});
  RU.ICON = window.RU_ICON || "../site/icon-256.png";
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const noise = (i) => { const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); };
  RU.noise = noise; RU.lerp = lerp; RU.ease = ease; RU.clamp = clamp;

  /* Mini-courbe : même rendu que src/chart.rs (240x36 px affichés en 120x18 pt). */
  RU.chart = (vals, lo, hi) => {
    const W = 240, H = 36, span = Math.max(1, hi - lo);
    const sample = (x) => {
      if (vals.length === 1) return vals[0];
      const pos = (x / (W - 1)) * (vals.length - 1);
      const i = Math.min(Math.floor(pos), vals.length - 2);
      const f = pos - i;
      return vals[i] * (1 - f) + vals[i + 1] * f;
    };
    const ypos = (v) => Math.round((H - 3) * (1 - clamp((v - lo) / span, 0, 1))) + 1;
    let area = `M0 ${H - 1}`, line = "";
    for (let x = 0; x < W; x++) {
      const y = ypos(sample(x));
      area += ` L${x} ${y}`;
      line += (x ? " L" : "M") + `${x} ${y + 1}`;
    }
    area += ` L${W - 1} ${H - 1} Z`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <path d="${area}" fill="rgb(90,160,255)" fill-opacity=".27"/>
      <path d="${line}" fill="none" stroke="rgb(90,160,255)" stroke-width="2"/>
      <line x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}" stroke="#8c8c8c" stroke-opacity=".35"/></svg>`;
  };

  /* Icône de la barre des menus : trois barres (comme icon.rs), en modèle monochrome. */
  RU.trayIcon = () => `<svg width="17" height="17" viewBox="0 0 36 36" fill="currentColor">
    <rect x="5" y="16" width="8" height="14" rx="1.5"/><rect x="14" y="6" width="8" height="24" rx="1.5"/><rect x="23" y="12" width="8" height="18" rx="1.5"/></svg>`;

  const wifi = `<svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 5a11 11 0 0 1 15 0M4.2 8a7 7 0 0 1 9.6 0"/><circle cx="9" cy="11.2" r="1.3" fill="currentColor" stroke="none"/></svg>`;

        ${keyRow}
        ${local ? A(140, 238, 280, 18, `<span class="hintt">100 % local, rien ne sort du Mac</span>`) : A(140, 238, 150, 18, `<span class="hintt">Dans le Trousseau macOS</span>`) + (keyExists ? A(300, 234, 125, 26, `Supprimer la clé`, "pbtn") : "")}
        ${A(140, 266, 285, 20, `<span class="link">Voir ce qui est envoyé à l'IA…</span>`)}
        ${A(20, 298, 400, 56, esc(status))}
        ${A(20, 372, 95, 32, `Tester`, "pbtn")}${A(230, 372, 95, 32, `Annuler`, "pbtn")}${A(330, 372, 95, 32, `Enregistrer`, "pbtn def")}
      </div></div>`;
  };

  /* ---- Données fictives communes ---- */
  RU.series = (base, amp, n = 60, seed = 1) => Array.from({ length: n }, (_, i) =>
    clamp(base + amp * (0.65 * Math.sin(i / (5 + seed) + seed * 2) + 0.35 * (noise(i + seed * 50) - 0.5) * 2), 1, 99));
  RU.PROCS = [
    "✅ WindowServer — 9 % CPU — 310 Mo",
    "👀 Google Chrome Helper ×18 — 7 % CPU — 2,9 Go",

  RU.REPORT = `État du Mac
⚠️ Disque presque plein : 14 Go libres (6 %)
✅ CPU 21 % · Mémoire 50 % · 48 °C — normal

Sécurité

👉 Conseil : Libère de l'espace disque (Réglages > Général > Stockage).`;
  RU.CHROME_DLG = `👀 Google Chrome Helper — À surveiller

Un onglet ou une extension de Google Chrome. Normal, mais beaucoup de RAM = trop d'onglets ouverts. Il utilise 2,9 Go de RAM : ferme ce qui ne sert pas.

CPU 7 % · mémoire 2,9 Go`;
  RU.XMRIG_DLG = `🛑 xmrig — Suspect

ressemble à un mineur de cryptomonnaie : CPU 95 % depuis 4 min, nom connu de mineur de cryptomonnaie (xmrig), lancé depuis un dossier temporaire (/tmp), non signé

Programme : /tmp/xmrig`;

  const staticMenu = (hover) => ({

  /* ---- Scènes statiques ---- */
  RU.scenes = {

    processus: (t) => ({

    }),

  RU.render = (scene, theme) => {

    return { w: s.w, h: s.h, html: `<div class="desk theme-${theme}" style="width:${s.w}px;height:${s.h}px">${s.html}<div class="tag">Illustration</div></div>` };

})();

<script>/* Démo animée : tout est une fonction pure du temps t (secondes) → déterministe,
   donc enregistrable image par image. Illustration : chiffres fictifs. */
(function () {
  // Sortie 1280x800 ; l'interface est dessinée en 984x616 puis agrandie (texte lisible en GIF).
  const OUT_W = 1280, OUT_H = 800, W = 984, H = 616, S = OUT_W / W, DUR = 25;
  const { lerp, ease, clamp, noise } = RU;
  const seg = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));
  const inR = (t, a, b) => t >= a && t < b;
  const oneLine = (s, n) => { const f = s.split(/\s+/).join(" "); return f.length <= n ? f : f.slice(0, n).trimEnd() + "…"; };

  const SUS0 = 4.0, SUS1 = 15.6;
  const cpu = (t) => {
    if (t < 2) return 13 + 3 * noise(Math.floor(t * 3));
    if (t < 4.2) return lerp(14, 96, seg(t, 2, 4.2));
    if (t < 14.8) return 95 + 2 * noise(Math.floor(t * 4) + 9);
    if (t < 16.4) return lerp(96, 12, seg(t, 14.8, 16.4));
    return 12 + 3 * noise(Math.floor(t * 3) + 3);
  };
  const temp = (t) => 46 + (cpu(t) - 13) * 0.3;
  const mem = (t) => 48 + (t > 4 && t < 15.6 ? 1.5 : 0) + noise(Math.floor(t * 2)) * 0.6;
  const suspect = (t) => inR(t, SUS0, SUS1);

  const PROCS = [
    "✅ WindowServer — 9 % CPU — 310 Mo",
    "👀 Google Chrome Helper ×18 — 7 % CPU — 2,9 Go",
    "✅ Claude Helper ×6 — 4 % CPU — 1,1 Go",
    "✅ mdworker_shared ×8 — 3 % CPU — 240 Mo",
    "❓ syncagentd — 2 % CPU — 85 Mo",
  ];
  const REASONS = "CPU 96 % depuis 1 min, nom connu de mineur de cryptomonnaie (xmrig), lancé depuis un dossier temporaire (/tmp), non signé";
  const XMRIG_DLG = `🛑 xmrig — Suspect\n\nressemble à un mineur de cryptomonnaie : ${REASONS}\n\nProgramme : /tmp/xmrig`;
  const CONFIRM = `Forcer « xmrig » (PID 4821) à quitter ?\n\nressemble à un mineur de cryptomonnaie : ${REASONS}`;
  const REPORT_CALM = `État du Mac
✅ CPU 12 % · Mémoire 49 % · Disque 42 Go libres · 46 °C — normal

Sécurité
✅ Aucun logiciel suspect détecté

Ce qui tourne
✅ WindowServer — Normal
   Dessine tout ce qui s'affiche à l'écran. Il monte avec plusieurs écrans ou beaucoup de fenêtres.
👀 Google Chrome Helper ×18 — À surveiller
   Un onglet ou une extension de Google Chrome. Normal, mais beaucoup de RAM = trop d'onglets ouverts. Il utilise 2,9 Go de RAM : ferme ce qui ne sert pas.
✅ Claude Helper ×6 — Normal
   Partie de l'application Claude (processus de fond). Normal.
✅ mdworker_shared ×8 — Normal
   Spotlight (la recherche) indexe tes fichiers. Temporaire, ça se calme tout seul.`;

  const MENU_X = W - 24 - 330;           // bord gauche du menu
  const SUB_X = MENU_X - 2 - 392;        // bord gauche du sous-menu
  const dlgBtns = (def, press) => (labels) => labels.map((l) => ({ label: l, def: l === def, press: press === l }));

  /* ---- Contenu de l'écran à l'instant t (sans le curseur) ---- */
  function scene(t) {
    const sus = suspect(t);
    const c = Math.round(cpu(t)), m = Math.round(mem(t));
    const title = `${sus ? "🛑 " : ""}${c}% · ${m}% · 42G`;
    const open1 = inR(t, 6.95, 9.75), open2 = inR(t, 17.15, 18.5);
    const open = open1 || open2;
    let hover = "";
    if (open1 && t >= 7.7) hover = "procs";
    if (open2 && t >= 17.9) hover = "report";
    const hist = (f, lo) => Array.from({ length: 60 }, (_, k) => f(Math.max(0, t - (59 - k) * 0.42)) + (noise(k * 7) - 0.5) * 3);
    let html = RU.menubar({ title, open });
    if (open) {
      html += RU.menu({
        headline: sus ? "🛑 Logiciel suspect : xmrig" : "✅ Tout va bien",
        cpu: { text: `CPU ${c} %`, vals: hist(cpu), lo: 0, hi: 100 },
        mem: { text: `Mémoire ${m} % · ${(m * 0.16).toFixed(1).replace(".", ",")} / 16 Go`, vals: hist(mem), lo: 0, hi: 100 },
        disk: "Disque 42 Go libres (17 %)",
        temp: { text: `Température ${Math.round(temp(t))} °C`, vals: hist(temp), lo: 20, hi: 100 },
        hover,
      });
      if (open1 && t >= 8.3) {
        const entries = sus ? ["🛑 xmrig — Suspect", ...PROCS] : PROCS;
        html += RU.submenu({ entries, hoverIdx: t >= 9.0 ? 0 : -1 });
      }
    }
    // Dialogues
    if (inR(t, 9.9, 12.85)) {
      const a = seg(t, 9.9, 10.15);
      html += RU.dialog({ text: XMRIG_DLG, w: 600, x: (W - 600) / 2, y: 150, opacity: a, scale: 0.96 + 0.04 * a,
        buttons: dlgBtns("OK", t > 12.62 ? "Forcer à quitter…" : "")(["Afficher dans le Finder", "Forcer à quitter…", "OK"]) });
    }
    if (inR(t, 12.9, 14.65)) {
      const a = seg(t, 12.9, 13.15);
      html += RU.dialog({ text: CONFIRM, w: 560, x: (W - 560) / 2, y: 180, opacity: a, scale: 0.96 + 0.04 * a,
        buttons: dlgBtns("Annuler", t > 14.45 ? "Forcer à quitter" : "")(["Annuler", "Forcer à quitter"]) });
    }
    if (inR(t, 18.6, 21.45)) {
      const a = seg(t, 18.6, 18.85);
      html += RU.dialog({ text: REPORT_CALM, small: 1, w: 700, x: (W - 700) / 2, y: 70, opacity: a, scale: 0.96 + 0.04 * a,
        buttons: dlgBtns("OK", t > 21.2 ? "OK" : "")(["Actualiser", "OK"]) });
    }
    if (t >= 21.9) {
      const a = seg(t, 21.9, 22.2);
      html += RU.settings({ x: (W - 440) / 2, y: 80, provider: "LM Studio (local)", model: "qwen3-4b-instruct", local: true, autostart: true,
        opacity: a, status: t > 23.6 ? "✅ Connexion OK (modèle qwen3-4b-instruct)" : "" });
    }
    // Notifications
    const nIn = (a, b) => { const s = seg(t, a, a + 0.35) * (1 - seg(t, b - 0.35, b)); return s; };
    if (inR(t, 4.3, 7.4)) {
      const s = nIn(4.3, 7.4);
      html += RU.notif({ title: "Ressource Utility", body: "🛑 Logiciel suspect : xmrig — " + oneLine(`ressemble à un mineur de cryptomonnaie : ${REASONS} /tmp/xmrig`, 140), x: W - 360 - 14 + (1 - s) * 380, y: 44, opacity: s });
    }
    if (inR(t, 14.7, 17.0)) {
      const s = nIn(14.7, 17.0);
      html += RU.notif({ title: "Ressource Utility", body: "xmrig a été arrêté.", x: W - 360 - 14 + (1 - s) * 380, y: 44, opacity: s });
    }
    return html;
  }

  const caption = (t) => {
    if (t < 4.0) return "Un Mac calme : ✅ Tout va bien";
    if (t < 6.9) return "Un processus s'emballe : la barre des menus passe en 🛑";
    if (t < 9.9) return "La liste Processus met les suspects en premier";
    if (t < 12.9) return "Le dialogue explique pourquoi, en français";
    if (t < 14.8) return "Arrêt du processus, après confirmation";
    if (t < 18.6) return "De retour au calme";
    if (t < 21.9) return "Bilan de santé : un verdict par processus";
    return "Réglages : IA au choix, dont LM Studio 100 % local";
  };

  /* ---- Curseur : positions des cibles mesurées dans le DOM ---- */
  let POS = null;
  function measure() {
    const probe = document.createElement("div");
    probe.className = "desk theme-dark";
    probe.style.cssText = `width:${W}px;height:${H}px;position:absolute;left:0;top:0;visibility:hidden;transform:scale(${S});transform-origin:0 0`;
    document.body.appendChild(probe);
    const find = (t, text, nth = 0) => {
      probe.innerHTML = scene(t);
      const els = [...probe.querySelectorAll(".mi, .btn")].filter((e) => e.textContent.trim().includes(text));
      const e = els[nth];
      if (!e) return { x: 500, y: 300 };
      const r = e.getBoundingClientRect();
      return { x: (r.left + Math.min(r.width / 2, 60 * S)) / S, y: (r.top + r.height / 2) / S };
    };
    POS = {
      tray: { x: W - 203 - 70, y: 16 },
      proc: find(8.0, "Processus"),
      xmrig: find(9.2, "xmrig — Suspect"),
      kill: find(11.0, "Forcer à quitter…"),
      confirm: find(13.5, "Forcer à quitter"),
      bilan: find(17.5, "Bilan de santé"),
      ok: find(20.0, "OK"),
      cancel: { x: (W - 440) / 2 + 277, y: 80 + 38 + 388 },
      idleA: { x: 500, y: 400 }, idleB: { x: 590, y: 460 },
    };
    probe.remove();
  }
  const keys = () => [
    [0, "idleA"], [5.8, "idleA"], [6.9, "tray"], [7.7, "proc"], [9.0, "xmrig"], [9.7, "xmrig"],
    [10.5, "idleA"], [11.6, "kill"], [12.7, "kill"], [13.6, "confirm"], [14.6, "confirm"],
    [15.6, "idleB"], [16.9, "tray"], [17.2, "tray"], [17.9, "bilan"], [18.4, "bilan"],
    [19.4, "ok"], [21.4, "ok"], [22.4, "idleA"], [24.0, "cancel"], [25, "cancel"],
  ];
  function cursorAt(t) {
    const k = keys();
    let i = 0;
    while (i < k.length - 2 && t >= k[i + 1][0]) i++;
    const [t0, n0] = k[i], [t1, n1] = k[i + 1];
    const f = ease(clamp((t - t0) / (t1 - t0), 0, 1));
    const a = POS[n0], b = POS[n1];
    return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f) };
  }
  const cursorSvg = `<svg class="cursor" viewBox="0 0 22 28"><path d="M2 1.5v21l5.4-5 3.6 8.2 3.2-1.4-3.6-8H19z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

  RU.demo = {
    W: OUT_W, H: OUT_H, DUR,
    html(t) {
      if (!POS) measure();
      const c = cursorAt(t);
      const fade = Math.min(seg(t, 0, 0.4), 1 - seg(t, DUR - 0.5, DUR));
      return `<div class="desk theme-dark" style="width:${W}px;height:${H}px;opacity:${fade};transform:scale(${S});transform-origin:0 0">
        ${scene(t)}
        <div class="caption"><span>${caption(t)}</span></div>
        <div class="tag">Illustration</div>
        ${cursorSvg.replace('class="cursor"', `class="cursor" style="left:${c.x - 2}px;top:${c.y - 1}px"`)}</div>`;
    },
  };
})();
</script>
<script>
(function () {
  const stage = document.getElementById("stage");
  const D = RU.demo;
  const fit = () => { const s = Math.min(innerWidth / D.W, innerHeight / D.H); stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth - D.W * s) / 2 + "px"; stage.style.top = (innerHeight - D.H * s) / 2 + "px"; };
  addEventListener("resize", fit); fit();
  const draw = (t) => { stage.innerHTML = D.html(t); };
  window.__draw = draw; window.__dur = D.DUR;
