[package]
name = "ressource-utility"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
keyring = "4.2.0"
libc = "0.2.191"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
